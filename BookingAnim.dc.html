<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/konnexplay-mark.svg" type="image/svg+xml">
<link rel="icon" href="assets/konnexplay-mark-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/konnexplay-mark-1024.png">
<meta name="theme-color" content="#0D1B3E">
<link rel="manifest" href="site.webmanifest">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
@keyframes kxIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes kxPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes kxBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</helmet>
<div style="font-family:Inter,sans-serif;color:#0D1B3E;width:100%">{{ scene }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;slot&quot;,&quot;calendar&quot;,&quot;questions&quot;,&quot;lifecycle&quot;],&quot;default&quot;:&quot;slot&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1600,&quot;min&quot;:600,&quot;max&quot;:4000,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  state = { step: 0, reduced: false };
  componentDidMount() {
    const mq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    const reduced = !!(mq && mq.matches);
    this.setState({ reduced, step: reduced ? 3 : 0 });
    if (!reduced) {
      const speed = this.props.speed ?? 1600;
      this._t = setInterval(() => this.setState(s => ({ step: s.step + 1 })), speed);
    }
  }
  componentWillUnmount() { clearInterval(this._t); }

  h(tag, style, ...kids) { return React.createElement(tag, { style }, ...kids); }
  label(text, color) { return this.h('div', { fontSize: 11, letterSpacing: '.12em', fontWeight: 700, color: color || '#5A6275', textTransform: 'uppercase' }, text); }
  out() { return 'Outfit,sans-serif'; }

  // Scene 1: a slot going AVAILABLE -> SELECTED -> PAID -> BOOKED -> CONFIRMED
  sceneSlot() {
    const st = this.state.step % 5;
    const dark = this.props.dark ?? false;
    const states = [
      { k: 'AVAILABLE', bg: dark ? '#0F1F45' : '#FFFFFF', bd: dark ? '#2A3859' : '#DDE0E5', fg: dark ? '#FFFFFF' : '#0D1B3E', sub: 'from ₹1,000 · tap to book' },
      { k: 'SELECTED', bg: '#E8FBF5', bd: '#0DC59A', fg: '#0D1B3E', sub: '1 hour · ₹1,000' },
      { k: 'PAID', bg: '#0DC59A', bd: '#0DC59A', fg: '#061428', sub: '₹1,000 received online' },
      { k: 'BOOKED', bg: '#0D1B3E', bd: '#0D1B3E', fg: '#FFFFFF', sub: 'Slot blocked everywhere' },
      { k: 'CONFIRMED', bg: '#0D1B3E', bd: '#0DC59A', fg: '#FFFFFF', sub: 'Confirmation sent to Rahul M.' }
    ];
    const s = states[st];
    const dots = states.map((x, i) => this.h('div', { flex: 1, height: 3, background: i <= st ? '#0DC59A' : (dark ? '#2A3859' : '#DDE0E5'), transition: 'background .3s' }));
    return this.h('div', { width: '100%', maxWidth: 420, animation: 'none' },
      this.h('div', { display: 'flex', gap: 6, marginBottom: 14 }, ...dots),
      this.h('div', { key: st, background: s.bg, border: '1.5px solid ' + s.bd, padding: '26px 26px 24px', transition: 'background .35s, border-color .35s', animation: 'kxIn .35s ease-out' },
        this.h('div', { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 12 },
          this.h('div', { fontFamily: this.out(), fontWeight: 700, fontSize: 40, letterSpacing: '-0.03em', lineHeight: 1, color: s.fg }, '8:00 PM'),
          this.h('div', { fontSize: 12, letterSpacing: '.14em', fontWeight: 700, color: st === 2 ? '#061428' : '#0DC59A' }, s.k)
        ),
        this.h('div', { fontSize: 14, color: st === 2 ? '#061428' : (st >= 3 ? '#B8C2D9' : '#5A6275'), marginTop: 10 }, 'Turf 1 · Saturday 13 September'),
        this.h('div', { fontSize: 15, fontWeight: 600, color: s.fg, marginTop: 16, paddingTop: 14, borderTop: '1px solid ' + (st >= 3 ? 'rgba(255,255,255,.18)' : 'rgba(13,27,62,.12)') }, s.sub)
      ),
      this.h('div', { fontSize: 12, color: dark ? '#8E9AB5' : '#5A6275', marginTop: 12 }, st >= 3 ? 'Owner sees the booking. No call was made.' : 'Player is booking on your venue page.')
    );
  }

  // Scene 2: owner calendar filling itself through the evening
  sceneCalendar() {
    const n = this.state.step;
    const courts = ['Turf 1', 'Turf 2', 'Court A', 'Court B'];
    const hours = ['5 PM', '6 PM', '7 PM', '8 PM', '9 PM', '10 PM'];
    const order = [[3,0],[3,1],[1,2],[2,3],[4,0],[0,1],[5,2],[3,2],[1,0],[4,3],[2,0],[0,3],[5,1],[1,3],[4,1],[2,2],[0,0],[5,0],[3,3],[1,1],[4,2],[2,1],[0,2],[5,3]];
    const filled = this.state.reduced ? 14 : (n % (order.length + 6));
    const set = new Set(order.slice(0, Math.min(filled, order.length)).map(p => p.join(',')));
    const paid = this.state.reduced ? 12 : Math.max(0, filled - 3);
    const cells = [];
    cells.push(this.h('div', {}));
    courts.forEach(c => cells.push(this.h('div', { fontSize: 11, letterSpacing: '.1em', fontWeight: 700, color: '#5A6275', paddingBottom: 4 }, c.toUpperCase())));
    hours.forEach((hr, hi) => {
      cells.push(this.h('div', { fontSize: 12, fontWeight: 600, color: '#5A6275', display: 'flex', alignItems: 'center' }, hr));
      courts.forEach((c, ci) => {
        const on = set.has(hi + ',' + ci);
        cells.push(this.h('div', { key: hi + '-' + ci + '-' + on, background: on ? '#0DC59A' : '#FFFFFF', border: '1px solid ' + (on ? '#0DC59A' : '#DDE0E5'), padding: '11px 10px', fontSize: 12, fontWeight: 600, color: on ? '#061428' : '#5A6275', transition: 'background .3s', animation: on ? 'kxIn .3s ease-out' : 'none' }, on ? 'Booked' : 'Open'));
      });
    });
    const count = Math.min(filled, order.length);
    return this.h('div', { width: '100%' },
      this.h('div', { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 12, marginBottom: 14, flexWrap: 'wrap' },
        this.h('div', { fontFamily: this.out(), fontWeight: 700, fontSize: 18, letterSpacing: '-0.02em' }, 'Saturday · your calendar'),
        this.h('div', { fontSize: 13, fontWeight: 600, color: '#088064' }, count + ' of 24 slots booked · ₹' + (count * 1000).toLocaleString('en-IN') + ' collected')
      ),
      this.h('div', { display: 'grid', gridTemplateColumns: '52px repeat(4,minmax(0,1fr))', gap: 6 }, ...cells),
      this.h('div', { fontSize: 12, color: '#5A6275', marginTop: 12 }, 'Every slot above was booked by a player online. Nobody at the venue picked up a phone.')
    );
  }

  // Scene 3: the questions that stop arriving
  sceneQuestions() {
    const qs = [
      ['Is 8 PM free?', 'Your booking website already shows it booked'],
      ['How much is the turf?', 'Your rates sit next to every slot'],
      ['Can I book tomorrow?', "Tomorrow's slots are live"],
      ['Is Sunday morning free?', "Sunday's open slots, court by court"],
      ['Which slot is available?', 'Every open slot, every court'],
      ['Can I pay now?', 'Paid online, in two taps'],
      ['Can you confirm my booking?', 'Confirmation goes out on its own']
    ];
    const n = this.state.reduced ? qs.length : this.state.step;
    const shown = qs.map((q, i) => {
      const answered = i < (n % (qs.length + 3));
      const narrow = (typeof window !== 'undefined' && window.innerWidth < 560);
      return this.h('div', { key: i, display: 'grid', gridTemplateColumns: narrow ? '1fr' : 'minmax(0,1fr) minmax(0,1fr)', alignItems: 'center', gap: narrow ? 4 : 20, padding: '14px 0', borderTop: '1px solid #DDE0E5', opacity: answered ? 1 : .35, transition: 'opacity .4s' },
        this.h('div', { fontFamily: this.out(), fontWeight: 700, fontSize: 20, letterSpacing: '-0.02em', textDecoration: answered ? 'line-through' : 'none', textDecorationColor: '#0DC59A', color: '#0D1B3E' }, '"' + q[0] + '"'),
        this.h('div', { fontSize: 15, lineHeight: 1.45, color: '#0D1B3E' }, q[1])
      );
    });
    return this.h('div', { width: '100%', borderBottom: '1px solid #DDE0E5' }, ...shown);
  }

  // Scene 4: booking -> customer -> repeat -> member -> revenue
  sceneLifecycle() {
    const steps = [['BOOKING', 'Rahul books Turf 1, Saturday 8 PM'], ['CUSTOMER', 'Name and number saved to your list'], ['REPEAT BOOKING', 'Books again the next two Saturdays'], ['MEMBERSHIP', 'Buys a ₹5,000 yearly membership'], ['MORE REVENUE', 'One player, twelve months of slots']];
    const n = this.state.reduced ? 4 : (this.state.step % (steps.length + 2));
    return this.h('div', { width: '100%' }, ...steps.map((s, i) => {
      const on = i <= n;
      return this.h('div', { key: i, display: 'flex', gap: 18, alignItems: 'flex-start', padding: '14px 0', borderTop: '1px solid #DDE0E5', opacity: on ? 1 : .3, transition: 'opacity .4s' },
        this.h('div', { width: 10, height: 10, marginTop: 7, background: on ? '#0DC59A' : '#DDE0E5', flexShrink: 0, transition: 'background .4s' }),
        this.h('div', {},
          this.h('div', { fontFamily: this.out(), fontWeight: 700, fontSize: 18, letterSpacing: '-0.02em', color: '#0D1B3E' }, s[0]),
          this.h('div', { fontSize: 14, color: '#5A6275', marginTop: 3 }, s[1])
        )
      );
    }));
  }

  renderVals() {
    const which = this.props.scene ?? 'slot';
    const map = { slot: () => this.sceneSlot(), calendar: () => this.sceneCalendar(), questions: () => this.sceneQuestions(), lifecycle: () => this.sceneLifecycle() };
    return { scene: (map[which] || map.slot)() };
  }
}
</script>
</body>
</html>
